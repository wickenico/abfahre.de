<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff1a1a">
  <title>Abfahre.de · Woll-O-Meter</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <link rel="stylesheet" href="/css/os.css">
  <style>
    .hoelle-gif {
      width: 100%;
      height: 48px;
      margin: 12px 0;
      border: 0;
      pointer-events: none;
    }

    .meter {
      height: 28px;
      border: var(--linie);
      border-radius: 6px;
      background: var(--grau);
      overflow: hidden;
    }

    .meter__fill {
      height: 100%;
      width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      background: var(--rot);
      color: var(--weiss);
      font: 700 13px var(--mono);
      transition: width 0.6s ease-out;
    }

    .result {
      margin: 16px 0 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .media {
      margin-top: 12px;
      border: var(--linie);
      border-radius: 6px;
      overflow: hidden;
    }

    .media:empty {
      display: none;
    }

    .media iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    .hoelle {
      padding: 24px 12px;
      background: var(--schwarz);
      color: var(--rot);
      font: 800 clamp(32px, 8vw, 56px)/1 var(--sans);
      text-align: center;
      text-transform: uppercase;
    }

    .fireworks {
      position: fixed;
      inset: 0;
      z-index: 35;
      pointer-events: none;
    }
  </style>
</head>

<body data-page="wolle">
  <main class="desktop">
    <section class="win win--app" style="--x: 150px; --y: 32px; --w: 520px;" aria-labelledby="wolle-title">
      <div class="win__bar">
        <span class="win__title" id="wolle-title">woll-o-meter.app</span>
        <button class="win__close" type="button" aria-label="Woll-O-Meter schließen">×</button>
      </div>
      <div class="win__body">
        <div class="row">
          <button class="btn btn--primary" type="button" id="gen-btn">Gib mir die Wolle Dröhnung!</button>
          <button class="btn" type="button" id="clear-btn">Clear</button>
        </div>
        <iframe class="hoelle-gif" src="https://giphy.com/embed/eJ40v0vG5yXoiKeaqb" title="Hölle Hölle Hölle"
          tabindex="-1"></iframe>
        <div class="meter" role="progressbar" aria-label="Wolle-Gehalt" aria-valuemin="0" aria-valuemax="100"
          aria-valuenow="0" id="meter">
          <div class="meter__fill" id="progress-bar"></div>
        </div>
        <p class="result" id="text-line" aria-live="polite"></p>
        <div class="media" id="meme-div"></div>
      </div>
    </section>
  </main>
  <div class="fireworks"></div>

  <script src="/js/os.js"></script>
  <script src="/js/fireworks.js"></script>
  <script>
    const btn = document.getElementById("gen-btn");
    const clearBtn = document.getElementById("clear-btn");
    const meter = document.getElementById("meter");
    const progressBar = document.getElementById("progress-bar");
    const textLine = document.getElementById("text-line");
    const memeDiv = document.getElementById("meme-div");
    const fireworks = new Fireworks.default(document.querySelector(".fireworks"));

    function setValue(value) {
      progressBar.style.width = value + "%";
      progressBar.textContent = value ? value + "%" : "";
      meter.setAttribute("aria-valuenow", value);
    }

    clearBtn.addEventListener("click", () => {
      setValue(0);
      memeDiv.innerHTML = "";
      textLine.textContent = "";
      fireworks.stop(true);
    });

    btn.addEventListener("click", () => {
      fireworks.stop(true);
      const randomNum = Math.floor(Math.random() * 100);
      setValue(randomNum);

      if (randomNum <= 25) {
        memeDiv.innerHTML = "<img src='/img/wolle_drake.jpg' alt='Wolle-Meme'>";
        textLine.textContent = "Wahnsinn da ist noch Luft nach oben!";
      } else if (randomNum <= 50) {
        memeDiv.innerHTML = "<img src='/img/wolle_finger.jpg' alt='Wolle zeigt auf dich'>";
        textLine.textContent = "Wolle liebt, verliert, vergisst dich und verzeiht dir!";
      } else if (randomNum <= 75) {
        memeDiv.innerHTML = "<div class='hoelle'>Hölle Hölle Hölle</div>";
        textLine.textContent = "Das hätte nicht mal das Ruhrgebiet von dir gedacht!";
      } else {
        memeDiv.innerHTML = "<iframe src='https://giphy.com/embed/fFCekfjgxDbgqLjCHd' title='Wolle feiert'></iframe>";
        textLine.textContent = "WOW du bist einfach geil!";
        fireworks.start();
      }
    });
  </script>
</body>

</html>
