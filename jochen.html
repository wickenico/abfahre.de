<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff1a1a">
  <title>Abfahre.de · Jochen</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <link rel="stylesheet" href="/css/os.css">
  <style>
    .video {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--schwarz);
    }

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .rick {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-top: var(--linie);
      font: 13px var(--mono);
    }

    .rick iframe {
      width: 96px;
      height: 72px;
      border: var(--linie);
      border-radius: 6px;
      pointer-events: none;
    }
  </style>
  <script data-ad-client="ca-pub-3761680934011190" async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
</head>

<body data-page="jochen">
  <main class="desktop">
    <section class="win win--app" style="--x: 150px; --y: 32px; --w: 720px;" aria-labelledby="jochen-title">
      <div class="win__bar">
        <span class="win__title" id="jochen-title">jochen.exe</span>
        <button class="win__close" type="button" aria-label="Jochen schließen">×</button>
      </div>
      <div class="win__body win__body--flush">
        <div class="video">
          <iframe src="https://www.youtube.com/embed/eBAymOWJQOg?autoplay=1" title="Never gonna give you up"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
        </div>
        <div class="rick">
          <iframe src="https://giphy.com/embed/olAik8MhYOB9K" title="Rick Astley tanzt" tabindex="-1"></iframe>
          <span>Jochen gibt dich niemals auf.</span>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/os.js"></script>
</body>

</html>
