<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff1a1a">
  <title>Abfahre.de</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <link rel="stylesheet" href="/css/os.css">
</head>

<body data-page="start">
  <main class="desktop">
    <section class="win" style="--x: 150px; --y: 32px; --w: 400px;" aria-labelledby="fact-title">
      <div class="win__bar">
        <span class="win__title" id="fact-title">unnützes_wissen.txt</span>
        <button class="win__close" type="button" aria-label="Fenster schließen">×</button>
      </div>
      <div class="win__body">
        <p class="fact" id="fact" aria-live="polite">Lade unnützes Wissen …</p>
        <button class="btn btn--primary" type="button" id="next-btn">Nochmal</button>
      </div>
    </section>

    <section class="win" style="--x: 590px; --y: 64px; --w: 380px;" aria-labelledby="meme-title">
      <div class="win__bar">
        <span class="win__title" id="meme-title">meme.jpg</span>
        <button class="win__close" type="button" aria-label="Fenster schließen">×</button>
      </div>
      <div class="win__body win__body--flush">
        <div class="meme"><img id="meme" alt=""></div>
        <p class="meme__caption" id="meme-caption">Lade Meme …</p>
      </div>
    </section>
  </main>

  <script src="/js/os.js"></script>
  <script>
    const factEl = document.getElementById("fact");
    const memeImg = document.getElementById("meme");
    const memeCaption = document.getElementById("meme-caption");
    const nextBtn = document.getElementById("next-btn");

    async function loadFact() {
      try {
        const data = await (await fetch("https://uselessfacts.jsph.pl/random.json?language=en")).json();
        factEl.textContent = data.text;
      } catch (error) {
        factEl.textContent = "Kein unnützes Wissen geladen. Nochmal drücken.";
      }
    }

    async function loadMeme(tries = 3) {
      try {
        const data = await (await fetch("https://meme-api.com/gimme")).json();
        if ((data.nsfw || data.spoiler) && tries > 1) return loadMeme(tries - 1);
        const previews = data.preview || [];
        memeImg.src = previews.length ? previews[previews.length - 1] : data.url;
        memeImg.alt = data.title || "Zufälliges Meme";
        memeCaption.textContent = `r/${data.subreddit} · ${data.title}`;
      } catch (error) {
        memeCaption.textContent = "Kein Meme geladen. Nochmal drücken.";
      }
    }

    nextBtn.addEventListener("click", async () => {
      nextBtn.disabled = true;
      await Promise.all([loadFact(), loadMeme()]);
      nextBtn.disabled = false;
    });

    loadFact();
    loadMeme();
  </script>
</body>

</html>
